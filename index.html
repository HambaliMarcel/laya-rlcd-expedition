<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work &amp; Sales Router</title>
  <style>
    :root {
      --bg: #f3f1ec;
      --card: #fffcf8;
      --ink: #1c1b19;
      --muted: #5f5a53;
      --line: #e3ddd3;
      --accent: #1f4d3a;
      --accent-ink: #f4faf6;
      --danger: #8d2e2e;
      --danger-bg: #fdf3f2;
      --bar: #d7efe3;
      --bar-fill: #1f4d3a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.85rem;
      font-weight: 620;
      letter-spacing: -0.03em;
    }

    .lede {
      margin: 0 0 28px;
      color: var(--muted);
      max-width: 38rem;
    }

    .status-pill {
      margin-top: 4px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .status-pill.loaded { color: var(--accent); }
    .status-pill.error { color: var(--danger); }

    form, .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      color: inherit;
      font: inherit;
    }

    textarea {
      min-height: 168px;
      resize: vertical;
      margin-bottom: 16px;
    }

    select { margin-bottom: 16px; }

    textarea:focus, select:focus, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled { opacity: 0.65; cursor: progress; }

    .panel { margin-top: 16px; }
    .panel[hidden] { display: none; }

    .decision {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: -0.03em;
    }

    .meta { margin: 6px 0 0; color: var(--muted); }

    .bars {
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
    }

    .bars li {
      display: grid;
      grid-template-columns: 9.5rem 1fr 3.5rem;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
      font-size: 0.92rem;
    }

    .track {
      height: 8px;
      background: var(--bar);
      border-radius: 99px;
      overflow: hidden;
    }

    .fill {
      display: block;
      height: 100%;
      background: var(--bar-fill);
    }

    .pct { text-align: right; color: var(--muted); }

    .error {
      margin: 0;
      color: var(--danger);
      background: var(--danger-bg);
      border-radius: 10px;
      padding: 12px 14px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Personal dashboard</p>
        <h1>Work &amp; Sales Router</h1>
      </div>
      <p class="status-pill" id="model-status">Laya: Loading...</p>
    </header>
    <p class="lede">Paste a task, lead, proposal, or project note. Laya returns one structured decision on this machine.</p>

    <form id="router">
      <label for="input">What are you deciding?</label>
      <textarea id="input" placeholder="Paste a task, opportunity, project update, or lead description..." required></textarea>

      <label for="kind">Decision type</label>
      <select id="kind">
        <option value="task">Task Priority</option>
        <option value="lead">Sales Lead</option>
        <option value="proposal">Proposal/Tender</option>
        <option value="risk">Project Risk</option>
      </select>

      <button type="submit" id="analyze">Analyze</button>
    </form>

    <section class="panel" id="panel" hidden aria-live="polite"></section>
  </main>

  <script>
    const form = document.getElementById("router");
    const input = document.getElementById("input");
    const kind = document.getElementById("kind");
    const button = document.getElementById("analyze");
    const panel = document.getElementById("panel");
    const modelStatus = document.getElementById("model-status");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      analyze();
    });

    refreshStatus();
    setInterval(refreshStatus, 2000);

    async function refreshStatus() {
      try {
        const response = await fetch("/health");
        const payload = await response.json();
        modelStatus.className = "status-pill";
        if (payload.state === "loaded") {
          modelStatus.textContent = "Laya: Loaded";
          modelStatus.classList.add("loaded");
        } else if (payload.state === "error") {
          modelStatus.textContent = "Laya: Error";
          modelStatus.classList.add("error");
        } else {
          modelStatus.textContent = "Laya: Loading...";
        }
      } catch (error) {
        modelStatus.textContent = "Laya: Error";
        modelStatus.className = "status-pill error";
      }
    }

    async function analyze() {
      const text = input.value.trim();
      if (!text) {
        showError("Paste something to analyze.");
        return;
      }

      button.disabled = true;
      button.textContent = "Analyzing…";
      panel.hidden = false;
      panel.innerHTML = '<p class="meta">Running Laya…</p>';

      let response;
      try {
        response = await fetch("/api/decide", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, kind: kind.value })
        });
      } catch (error) {
        showError("Could not reach the local server.");
        return;
      }

      let payload;
      try {
        payload = await response.json();
      } catch (error) {
        showError("The server returned a response that was not JSON.");
        return;
      }

      if (!response.ok) {
        showError(payload.error || "The decision failed.");
        return;
      }

      renderDecision(payload);
      button.disabled = false;
      button.textContent = "Analyze";
    }

    function renderDecision(payload) {
      const probabilities = payload.probabilities || {};
      const rows = Object.keys(probabilities)
        .map((label) => ({ label: label, value: Number(probabilities[label]) }))
        .filter((row) => Number.isFinite(row.value))
        .sort((a, b) => b.value - a.value);

      const list = rows.map((row) => {
        const width = Math.max(0, Math.min(100, row.value * 100));
        return (
          "<li><span>" + escapeHtml(row.label) + "</span>" +
          '<span class="track"><span class="fill" style="width:' + width.toFixed(1) + '%"></span></span>' +
          '<span class="pct">' + formatPercent(row.value) + "</span></li>"
        );
      }).join("");

      const confidence = Number(payload.confidence);
      const confidenceText = Number.isFinite(confidence) ? formatPercent(confidence) : "unavailable";

      panel.hidden = false;
      panel.innerHTML =
        '<p class="decision">' + escapeHtml(payload.decision) + "</p>" +
        '<p class="meta">Confidence ' + confidenceText + "</p>" +
        '<p class="meta">Model ' + escapeHtml(payload.repo || payload.model) +
        " · " + escapeHtml(payload.model) + "</p>" +
        '<p class="meta">Inference ' + escapeHtml(String(payload.latency_ms)) + " ms</p>" +
        (list ? '<ul class="bars">' + list + "</ul>" : "");
    }

    function showError(message) {
      panel.hidden = false;
      panel.innerHTML = '<p class="error">' + escapeHtml(message) + "</p>";
      button.disabled = false;
      button.textContent = "Analyze";
    }

    function formatPercent(value) {
      const pct = value * 100;
      const rounded = Math.round(pct * 10) / 10;
      const text = Math.abs(rounded - Math.round(rounded)) < 0.05
        ? String(Math.round(rounded))
        : rounded.toFixed(1);
      return text + "%";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
